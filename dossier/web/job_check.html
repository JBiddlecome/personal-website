<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>Job Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dossier/styles.css">
    <style>
        .jc { max-width: 640px; margin: 1.5rem auto 3rem; padding: 1.2rem 16px; background: var(--paper); border-radius: 3px; }
        .jc h1 { font-family: var(--stencil); font-size: 1.6rem; }
        .jc-legend { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; margin: 0.6rem 0 0.9rem; font-size: 0.9rem; }
        .jc-legend .today { font-weight: 700; text-decoration: underline; }
        .jc-grid { display: grid; grid-template-columns: repeat(10, 1fr); border: 2px solid var(--ink); }
        .jc-grid button { position: relative; aspect-ratio: 1; border: 1px solid var(--rule); background: #fffaf0; cursor: pointer; font: 700 clamp(1rem, 4.5vw, 1.8rem) var(--type); }
        .jc-grid button:hover { background: #fff3d6; }
        .jc-grid button:focus-visible { outline: 3px solid var(--red); outline-offset: -3px; }
        .jc-grid .n { position: absolute; top: 1px; left: 3px; font-size: 0.55rem; color: var(--ink-faint); font-weight: 400; }
        .jc-grid .m { position: absolute; inset: 0; display: grid; place-items: center; }
        .jc-grid .m svg { width: 72%; height: 72%; }
        .jc svg path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .jc-legend svg { width: 1em; height: 1em; vertical-align: -0.12em; }
        .jc-state { margin-top: 0.7rem; font-size: 0.85rem; color: var(--ink-soft); min-height: 1.3em; }
        .jc-state.err { color: var(--red); font-weight: 700; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-inner">
        <span class="agency">JOB CHECK</span>
        <span class="topbar-actions"><a href="/dossier" class="topbar-link">SUBJECT FILE</a><button type="button" id="logout">CLOSE FILE</button></span>
    </div>
</div>
<main class="jc">
    <h1>Applications this week</h1>
    <div class="jc-legend" id="legend"></div>
    <div class="jc-grid" id="grid" role="group" aria-label="Application grid"></div>
    <p class="jc-state" id="state" role="status">Loading…</p>
</main>
<script src="/dossier/job_check.js"></script>
</body>
</html>
